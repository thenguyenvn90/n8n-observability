services:
  # =========================
  # Reverse proxy (HTTPS)
  # =========================
  traefik:
    image: traefik:v2.11
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      # EntryPoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      # Providers
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=n8n-network"
      # ACME (production)
      - "--certificatesresolvers.le.acme.email=${SSL_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      # Logs
      - "--log.level=INFO"
      - "--accesslog=true"
      # Health check
      - "--ping=true"
      - "--ping.entrypoint=traefikping"
      - "--entrypoints.traefikping.address=:8082"
      # Prometheus metrics (internal entrypoint)
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addRoutersLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
      - "--entrypoints.metrics.address=:8081"
      - "--metrics.prometheus.entryPoint=metrics"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
      - ./secrets/htpasswd:${TRAEFIK_USERSFILE}:ro
    networks: [n8n-network]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/ping"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  # =========================
  # Data services
  # =========================
  postgres:
    image: postgres:14
    restart: unless-stopped
    env_file: [.env]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [n8n-network]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${STRONG_PASSWORD}"]
    volumes:
      - redis-data:/data
    networks: [n8n-network]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${STRONG_PASSWORD}", "ping"]
      interval: 10s
      timeout: 10s
      start_period: 10s
      retries: 5

  # =========================
  # n8n (queue mode)
  # =========================
  main:
    image: docker.n8n.io/n8nio/n8n:${N8N_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      - N8N_METRICS=true
      # The four n8n_scaling_mode_queue_jobs_* metrics. Main-only by design, and
      # sampled rather than live: n8n polls Bull on an interval and flushes its
      # completed/failed counters in lumps, so a burst shorter than the interval is
      # invisible and events missed during a restart are gone. Redis key checks
      # (see redis-exporter) cover depth; these cover the rate.
      - N8N_METRICS_INCLUDE_QUEUE_METRICS=true
      # 20s is the default and too coarse to see a burst arrive.
      - N8N_METRICS_QUEUE_METRICS_INTERVAL=5
      # The ceiling that concurrency competes for. Pool exhaustion is a documented
      # queue-mode failure and it presents as slowness, not as an error, so
      # n8n_db_pool_requests_pending above zero is the signal to read before
      # raising --concurrency any further.
      - N8N_METRICS_INCLUDE_DB_POOL_METRICS=true
      # How work arrives, per workflow and status code.
      - N8N_METRICS_INCLUDE_WEBHOOK_METRICS=true
      # workflow_id on the duration histogram: roughly 3,800 series at 35 workflows,
      # growing linearly and never collected until restart. Safe at this size.
      # NODE_TYPE_LABEL is deliberately absent — on its own it adds nothing, and
      # paired with MESSAGE_EVENT_BUS_METRICS it multiplies event x workflow x node.
      - N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL=true
      # A gauge mapping workflow id to name, so dashboards can show names.
      - N8N_METRICS_INCLUDE_WORKFLOW_INFO=true
      # n8n_last_activity plus an HTTP request histogram.
      - N8N_METRICS_INCLUDE_API_ENDPOINTS=true
      - N8N_METRICS_INCLUDE_CACHE_METRICS=true
      - N8N_METRICS_INCLUDE_EXECUTION_DATA_METRICS=true
    volumes:
      - n8n-data:/home/node/.n8n
      - ./local-files:/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["start"]
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:${N8N_PORT:-5678}/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n-network"
      # Router & TLS
      - "traefik.http.routers.n8n.rule=Host(`${N8N_FQDN}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.routers.n8n.tls.certresolver=le"
      # Bind router -> this service (Traefik service name is arbitrary)
      - "traefik.http.routers.n8n.service=n8n-main"
      - "traefik.http.services.n8n-main.loadbalancer.server.port=5678"
      # Middlewares (security + rate limit + compression)
      - "traefik.http.routers.n8n.middlewares=n8n-headers,n8n-rate,n8n-retry,n8n-compress"
      - "traefik.http.middlewares.n8n-headers.headers.stsSeconds=315360000"
      - "traefik.http.middlewares.n8n-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.n8n-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.n8n-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.n8n-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.n8n-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.n8n-rate.ratelimit.average=100"
      - "traefik.http.middlewares.n8n-rate.ratelimit.burst=50"
      - "traefik.http.middlewares.n8n-rate.ratelimit.period=1s"
      - "traefik.http.middlewares.n8n-retry.retry.attempts=3"
      - "traefik.http.middlewares.n8n-compress.compress=true"
    networks: [n8n-network]
    security_opt: [no-new-privileges:true]

  # External Task Runner for n8n-main
  runner-main:
    image: docker.n8n.io/n8nio/n8n:${N8N_IMAGE_TAG}
    restart: unless-stopped
    env_file: [.env]
    environment:
      - N8N_METRICS=true
    entrypoint: ["/usr/local/bin/task-runner-launcher"]
    command: ["javascript"]
    depends_on:
      main:
        condition: service_started
      redis:
        condition: service_healthy
    networks: [n8n-network]
    security_opt: [no-new-privileges:true]

  # Worker(s) – scale horizontally
  worker:
    image: docker.n8n.io/n8nio/n8n:${N8N_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      # Required for Prometheus to reach the worker at all. In queue mode the worker
      # is where executions run, and it registers the execution histogram alongside
      # the main: scraping only the main loses about half the execution data and all
      # of the worker's CPU, heap and event-loop lag.
      - N8N_METRICS=true
      # Without this a queue worker exposes no health endpoint whatsoever, which is
      # why the healthcheck below could not exist before.
      - QUEUE_HEALTH_CHECK_ACTIVE=true
    # --concurrency is a CLI flag with no environment fallback (confirmed from
    # `n8n worker --help` on a running container), so it has to be interpolated
    # here. The default is n8n's own: 10. n8n warns below 5 that the environment
    # may be unstable. For LLM-bound work — mostly waiting on HTTP — start at the
    # default and read pool saturation and worker CPU before changing it; a Node
    # worker saturates near one core however many the host has, so once CPU
    # approaches 1.0 the answer is another worker process, not a higher number.
    command: ["worker", "--concurrency=${N8N_WORKER_CONCURRENCY:-10}"]
    volumes:
      - n8n-data:/home/node/.n8n
      - ./local-files:/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    networks: [n8n-network]
    security_opt: [no-new-privileges:true]

  # =========================
  # Monitoring (profile)
  # =========================
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      # 90d rather than 15d. The questions this stack exists to answer — when is the
      # system busy, is the queue trending worse, did that change help — need more
      # than a fortnight. At this cardinality the cost is small: a live instance at
      # roughly 8,000 series was using single-digit megabytes per day.
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-90d}"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [n8n-network]
    labels:
      - "traefik.enable=${EXPOSE_PROMETHEUS:-false}"
      - "traefik.docker.network=n8n-network"
      - "traefik.http.routers.prom.rule=Host(`${PROMETHEUS_FQDN}`)"
      - "traefik.http.routers.prom.entrypoints=websecure"
      - "traefik.http.routers.prom.tls.certresolver=le"
      - "traefik.http.services.prom.loadbalancer.server.port=9090"
      - "traefik.http.routers.prom.middlewares=prom-auth@docker"
      - "traefik.http.middlewares.prom-auth.basicauth.usersfile=${TRAEFIK_USERSFILE}"

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_DOMAIN=${GRAFANA_FQDN}
      - GF_SERVER_ROOT_URL=https://${GRAFANA_FQDN}
      - GF_SERVER_ENFORCE_DOMAIN=true
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      # The provider file lives here and points at /var/lib/grafana/dashboards,
      # which is where the repo's JSON is mounted below. Without a provider file
      # Grafana provisions nothing, and the dashboards in ./dashboard had to be
      # imported by hand.
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./dashboard:/var/lib/grafana/dashboards:ro
      # "alerting", not "alerts" — Grafana reads only the former, so anything
      # placed in an "alerts" directory was silently ignored.
      - ./monitoring/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
    networks: [n8n-network]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n-network"
      - "traefik.http.routers.grafana.rule=Host(`${GRAFANA_FQDN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.tls.certresolver=le"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      # Proxy Basic Auth (users file)
      - "traefik.http.routers.grafana.middlewares=grafana-auth@docker,secure-headers@docker"
      - "traefik.http.middlewares.grafana-auth.basicauth.usersfile=${TRAEFIK_USERSFILE}"
      - "traefik.http.middlewares.grafana-auth.basicauth.removeheader=true"
      # Harden headers
      - "traefik.http.middlewares.secure-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.secure-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.secure-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.secure-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.secure-headers.headers.contentTypeNosniff=true"
    depends_on:
      prometheus:
        condition: service_started

  postgres-exporter:
    profiles: ["monitoring"]
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    networks: [n8n-network]
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    profiles: ["monitoring"]
    image: oliver006/redis_exporter:latest
    restart: unless-stopped
    command:
      - "--redis.addr=redis:6379"
      - "--redis.password=${STRONG_PASSWORD}"
      # Queue depth straight from Bull's own keys, as redis_key_size. Better than
      # n8n's gauges for depth: live rather than sampled, and it keeps reporting
      # while the main process is restarting. Bull deletes a list once it empties,
      # so a missing key means zero — every query over these needs `or vector(0)`.
      - "--check-keys=bull:jobs:wait,bull:jobs:active,bull:jobs:delayed,bull:jobs:failed,bull:jobs:paused"
    networks: [n8n-network]
    depends_on:
      redis:
        condition: service_healthy

  cadvisor:
    profiles: ["monitoring"]
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    privileged: true
    # Left at its defaults on a busy host, cAdvisor's payload grows large enough to
    # be refused by a scraper with a response-size limit — seen on a live box. The
    # collectors turned off below are the ones that grow per container and answer no
    # question this stack asks; CPU, memory, network and filesystem all survive.
    command:
      - "--housekeeping_interval=15s"
      - "--docker_only=true"
      - "--store_container_labels=false"
      - "--disable_metrics=percpu,sched,tcp,udp,advtcp,process,hugetlb,referenced_memory,cpu_topology,resctrl"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [n8n-network]

  node-exporter:
    profiles: ["monitoring"]
    image: prom/node-exporter:latest
    restart: unless-stopped
    pid: "host"
    networks: [n8n-network]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'

networks:
  n8n-network:
    name: n8n-network
    driver: bridge

volumes:
  n8n-data:
    external: true
  postgres-data:
    external: true
  redis-data:
    external: true
  letsencrypt:
    external: true
  prometheus-data:
  grafana-data:
